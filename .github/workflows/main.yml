name: Build Offline Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Bundle Web Assets into Flutter App
        run: |
          # 1. ពន្លាឯកសារគម្រោង Studio
          if [ -f "khmer-movie-recap-script-studio.zip" ]; then
            unzip -o khmer-movie-recap-script-studio.zip
          fi

          # 2. បង្កើតគម្រោង Flutter ថ្មី
          flutter create --org com.recapcraft --project-name recapcraft_app studio_offline_app
          cd studio_offline_app
          flutter pub add webview_flutter

          # 3. បញ្ចូលឯកសារ Web ទៅក្នុង Assets របស់ App
          mkdir -p assets/web
          cp -r ../src assets/web/ 2>/dev/null || true
          cp ../index.html assets/web/ 2>/dev/null || true

          # 4. កំណត់ pubspec.yaml ដើម្បីទទួលស្គាល់ Folder assets
          sed -i '/flutter:/a \  assets:\n    - assets/web/\n    - assets/web/src/' pubspec.yaml

          # បើកសិទ្ធិ Internet
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # 5. សរសេរកូដ Flutter ដើម្បីដំណើរការឯកសារ Studio ផ្ទាល់ក្នុងទូរស័ព្ទ
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const OfflineStudioApp());
          }

          class OfflineStudioApp extends StatelessWidget {
            const OfflineStudioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Khmer Movie Recap Script Studio',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const StudioScreen(),
              );
            }
          }

          class StudioScreen extends StatefulWidget {
            const StudioScreen({super.key});

            @override
            State<StudioScreen> createState() => _StudioScreenState();
          }

          class _StudioScreenState extends State<StudioScreen> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF090D16))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (String url) {
                      setState(() {
                        _isLoading = false;
                      });
                    },
                  ),
                )
                ..loadFlutterAsset('assets/web/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF090D16),
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        const Center(
                          child: CircularProgressIndicator(color: Color(0xFFF59E0B)),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 6. Build ចេញជាឯកសារ APK
          flutter build apk --release
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/

      - name: Upload APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0-offline-${{ github.run_number }}
          name: RecapCraft Studio Offline v4.0
          files: build_output/app-release.apk
          
