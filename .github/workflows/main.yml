name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract ZIP & Prepare Web
        id: prepare
        run: |
          # ពន្លាឯកសារ ZIP ប្រសិនបើមានក្នុង Repository
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d ./extracted_app \; || true
          
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies & Build Web App
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: |
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force
          npm run build

      - name: Initialize & Sync Capacitor (JSON Config)
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: |
          rm -f capacitor.config.ts capacitor.config.js
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.recapcraft.studio",
            "appName": "RecapCraft Studio",
            "webDir": "dist"
          }
          EOF

          npx cap add android || true
          npx cap sync android

      - name: Accept Licenses & Build APK
        run: |
          # យល់ព្រមលើ Android Licenses លើ SDK ស្រាប់របស់ GitHub Runner
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          ANDROID_DIR=$(find . -type d -name "android" -not -path "*/node_modules/*" | head -n 1)
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecapCraft-Studio-APK
          path: "**/app-debug.apk"
          
