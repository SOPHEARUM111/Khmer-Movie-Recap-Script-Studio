name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP & Find Project
        id: prepare
        run: |
          # ពន្លាឯកសារ ZIP គម្រោងទាំងអស់ដែលមានក្នុង Repository
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d ./extracted_app \;
          
          # រកទីតាំងឯកសារ package.json
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: រកមិនឃើញឯកសារ package.json ទេ!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "បានរកឃើញគម្រោងនៅ៖ $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies & Build Web App
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build

      - name: Initialize & Sync Capacitor
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: |
          npx cap init "RecapCraft Studio" "com.recapcraft.studio" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          ANDROID_DIR=$(find . -type d -name "android" -not -path "*/node_modules/*" | head -n 1)
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecapCraft-Studio-APK
          path: "**/app-debug.apk"
          
