name: Build Offline Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Build Web Dist and Flutter APK
        run: |
          # 1. ពន្លា zip ប្រសិនបើមាន
          if [ -f "khmer-movie-recap-script-studio.zip" ]; then
            unzip -o khmer-movie-recap-script-studio.zip
          fi

          # 2. បង្កើតឯកសារ web production build (HTML/CSS/JS)
          npm install
          npm run build || true

          # 3. បង្កើតគម្រោង Flutter
          flutter create --org com.recapcraft --project-name recapcraft_app app_runner
          cd app_runner
          flutter pub add webview_flutter

          # បើកសិទ្ធិ Internet
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # 4. ចម្លងឯកសារ dist ចូល assets
          mkdir -p assets/web
          if [ -d "../dist" ]; then
            cp -r ../dist/* assets/web/
          else
            cp ../index.html assets/web/
          fi

          # 5. បញ្ចូលការកំណត់ assets ទៅក្នុង pubspec.yaml យ៉ាងត្រឹមត្រូវ
          cat << 'EOF' >> pubspec.yaml

flutter:
  assets:
    - assets/web/
    - assets/web/assets/
EOF

          # 6. សរសេរកូដ Flutter WebView
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const OfflineStudioApp());
          }

          class OfflineStudioApp extends StatelessWidget {
            const OfflineStudioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Khmer Movie Recap Script Studio',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const StudioScreen(),
              );
            }
          }

          class StudioScreen extends StatefulWidget {
            const StudioScreen({super.key});

            @override
            State<StudioScreen> createState() => _StudioScreenState();
          }

          class _StudioScreenState extends State<StudioScreen> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF090D16))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (String url) {
                      setState(() {
                        _isLoading = false;
                      });
                    },
                  ),
                )
                ..loadFlutterAsset('assets/web/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF090D16),
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        const Center(
                          child: CircularProgressIndicator(color: Color(0xFFF59E0B)),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 7. Build APK
          flutter build apk --release
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/

      - name: Upload APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0-offline-${{ github.run_number }}
          name: RecapCraft Studio Offline v4.1
          files: build_output/app-release.apk
          
