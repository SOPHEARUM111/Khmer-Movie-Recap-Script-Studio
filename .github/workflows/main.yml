name: Build Offline Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Build Web Dist and Flutter APK
        run: |
          # 1. ពន្លា zip គម្រោង
          if [ -f "khmer-movie-recap-script-studio.zip" ]; then
            unzip -o khmer-movie-recap-script-studio.zip
          fi

          # 2. ដំឡើងបណ្ណាល័យ Node និង Build Web production
          npm install --legacy-peer-deps
          npm run build || true

          # 3. បង្កើតគម្រោង Flutter
          flutter create --org com.recapcraft --project-name recapcraft_app app_runner
          cd app_runner

          # បើកសិទ្ធិ Internet
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # 4. ចម្លងឯកសារ web ចូល assets
          mkdir -p assets/web
          if [ -d "../dist" ]; then
            cp -r ../dist/* assets/web/
          else
            cp ../index.html assets/web/
          fi

          # កែសម្រួលផ្លូវ asset ក្នុង index.html ឱ្យដំណើរការស្រួលក្នុង WebView
          sed -i 's|"/assets/|"assets/|g' assets/web/index.html 2>/dev/null || true
          sed -i 's|"/|""|g' assets/web/index.html 2>/dev/null || true

          # 5. បង្កើត pubspec.yaml ពេញលេញ និងត្រឹមត្រូវ 100% (គ្មានការស្ទួន key flutter: ទៀតឡើយ)
          cat << 'EOF' > pubspec.yaml
          name: recapcraft_app
          description: "Khmer Movie Recap Script Studio"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.8.0

          dev_dependencies:
            flutter_test:
              sdk: flutter

          flutter:
            uses-material-design: true
            assets:
              - assets/web/
              - assets/web/assets/
          EOF

          # 6. ដំឡើង dependencies តាម pubspec.yaml ថ្មី
          flutter pub get

          # 7. សរសេរកូដ Flutter WebView
          cat << 'END_DART' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MaterialApp(
              debugShowCheckedModeBanner: false,
              home: StudioAppScreen(),
            ));
          }

          class StudioAppScreen extends StatefulWidget {
            const StudioAppScreen({super.key});

            @override
            State<StudioAppScreen> createState() => _StudioAppScreenState();
          }

          class _StudioAppScreenState extends State<StudioAppScreen> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF090D16))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (String url) {
                      setState(() {
                        _isLoading = false;
                      });
                    },
                  ),
                )
                ..loadFlutterAsset('assets/web/index.html');
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF090D16),
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        const Center(
                          child: CircularProgressIndicator(color: Color(0xFFF59E0B)),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          END_DART

          # 8. Build ចេញជាឯកសារ APK
          flutter build apk --release
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/

      - name: Upload APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.4.0-studio-${{ github.run_number }}
          name: RecapCraft Full Studio v4.4
          files: build_output/app-release.apk
