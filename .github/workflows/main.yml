name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract ZIP & Find Project
        id: prepare
        run: |
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d ./extracted_app \;
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies & Build Web App
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: |
          echo "Installing dependencies..."
          npm install --force
          npm install @capacitor/core @capacitor/cli @capacitor/android --force
          npm run build

      - name: Initialize & Sync Capacitor (JSON Config)
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: |
          # លុបឯកសារ ts config ចាស់ចោលប្រសិនបើមាន ដើម្បីកុំឱ្យជួប CommonJS Error
          rm -f capacitor.config.ts capacitor.config.js

          # បង្កើតឯកសារ capacitor.config.json សុទ្ធ
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.recapcraft.studio",
            "appName": "RecapCraft Studio",
            "webDir": "dist"
          }
          EOF

          echo "Adding Android platform..."
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          ANDROID_DIR=$(find . -type d -name "android" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Error: Android folder not found!"
            exit 1
          fi
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecapCraft-Studio-APK
          path: "**/app-debug.apk"
          
