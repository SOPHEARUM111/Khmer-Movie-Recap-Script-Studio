name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate Project Directory
        id: find_dir
        run: |
          # ស្វែងរកឯកសារ package.json នៅគ្រប់កម្រិត Folder
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found in repository!"
            find . -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found project at: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies & Build Web
        working-directory: ${{ steps.find_dir.outputs.project_dir }}
        run: |
          echo "Installing Dependencies..."
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo "Building Web App..."
          npm run build

      - name: Setup Capacitor Android
        working-directory: ${{ steps.find_dir.outputs.project_dir }}
        run: |
          # កំណត់ Capacitor និងចម្លងឯកសារ Web ទៅកាន់ Android
          npx cap init "RecapCraft Studio" "com.recapcraft.studio" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          ANDROID_DIR=$(find . -type d -name "android" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Error: Android folder not found!"
            exit 1
          fi
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecapCraft-Studio-APK
          path: "**/app-debug.apk"
          
