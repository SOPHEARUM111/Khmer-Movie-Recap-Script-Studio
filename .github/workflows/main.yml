name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web & Prepare Capacitor
        run: |
          # ស្វែងរក package.json ប្រសិនបើស្ថិតក្នុង Folder រង
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              echo "Moving into project directory: $SUBDIR"
              cd "$SUBDIR"
            fi
          fi

          echo "Installing Dependencies..."
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android

          echo "Building Web App..."
          npm run build

          echo "Initializing Capacitor Android..."
          npx cap init "RecapCraft Studio" "com.recapcraft.studio" --web-dir "dist" || true
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          ANDROID_DIR=$(find . -type d -name "android" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Android directory not found!"
            exit 1
          fi
          cd "$ANDROID_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RecapCraft-Studio-APK
          path: "**/app-debug.apk"
          
