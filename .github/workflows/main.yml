name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Capacitor
        run: |
          # ១. ពន្លា ZIP ប្រសិនបើមាន
          find . -maxdepth 2 -name "*.zip" -exec unzip -o {} -d ./extracted_app \; || true

          # ២. ស្វែងរកទីតាំង index.html ដើមរបស់គម្រោង
          HTML_PATH=$(find . -name "index.html" -not -path "*/android/*" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$HTML_PATH" ]; then
            echo "រកមិនឃើញ index.html ទេ!"
            exit 1
          fi
          APP_DIR=$(dirname "$HTML_PATH")
          echo "Found web content at: $APP_DIR"

          # ៣. ដំឡើង Capacitor ក្នុង Root
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android --force

          # ៤. រៀបចំ Folder dist ឱ្យមានឯកសារ Web គ្រប់ជ្រុងជ្រោយ
          rm -rf dist
          mkdir -p dist
          cp -r "$APP_DIR"/* dist/ || true

          # ៥. បង្កើត config ចង្អុលទៅ dist ផ្ទាល់
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.recapcraft.studio",
            "appName": "RecapCraft Studio",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          # ៦. បង្កើត និង Sync Android
          npx cap add android || true
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecapCraft-Studio-APK
          path: "**/app-debug.apk"
          
