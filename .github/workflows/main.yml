name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Setup Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android --force

          # បង្កើត folder dist និងចម្លងឯកសារ index.html ចូល
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html

          # បង្កើត capacitor.config.json ដែលដំណើរការជា HTTP ក្នុង Local WebView
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.recapcraft.studio",
            "appName": "RecapCraft Studio",
            "webDir": "dist",
            "server": {
              "androidScheme": "http",
              "cleartext": true
            }
          }
          EOF

          # បង្កើត Folder Android និង Sync
          rm -rf android
          npx cap add android
          npx cap sync android

          # ធានាថាឯកសារ index.html ត្រូវបានចម្លងចូលទៅដល់ Android Assets ផ្ទាល់ ១០០%
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Build APK with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecapCraft-Studio-APK
          path: "**/app-debug.apk"

