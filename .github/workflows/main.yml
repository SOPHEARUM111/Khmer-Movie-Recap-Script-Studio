name: Build and Release Full Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Create Full Studio App
        run: |
          flutter create --org com.recapcraft --project-name recapcraft_app studio_app
          cd studio_app
          flutter pub add http cupertino_icons
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;

          void main() {
            runApp(const FullStudioApp());
          }

          class FullStudioApp extends StatelessWidget {
            const FullStudioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'RecapCraft Studio Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF090D16),
                  primaryColor: const Color(0xFFF59E0B),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFFF59E0B),
                    secondary: Color(0xFF6366F1),
                    surface: Color(0xFF0F172A),
                  ),
                ),
                home: const MainStudioScreen(),
              );
            }
          }

          class MainStudioScreen extends StatefulWidget {
            const MainStudioScreen({super.key});

            @override
            State<MainStudioScreen> createState() => _MainStudioScreenState();
          }

          class _MainStudioScreenState extends State<MainStudioScreen> {
            int _currentTab = 0;
            final TextEditingController _titleController =
                TextEditingController(text: 'រឿង បិសាចជញ្ជក់ឈាម');
            final TextEditingController _synopsisController =
                TextEditingController(text: 'រឿងរ៉ាវដ៏អាថ៌កំបាំងនៅក្នុងភូមិដាច់ស្រយាលមួយ...');
            
            bool _isGenerating = false;
            String _selectedVoice = 'អ្នកសម្រាយ';
            double _readingSpeed = 1.0;
            double _fontSize = 20.0;

            final List<Map<String, dynamic>> _characters = [
              {'role': 'អ្នកសម្រាយ', 'icon': '🎙️', 'color': Colors.indigo},
              {'role': 'ក្មេងប្រុស', 'icon': '👦', 'color': Colors.blue},
              {'role': 'ក្មេងស្រី', 'icon': '👧', 'color': Colors.pink},
              {'role': 'មនុស្សប្រុស', 'icon': '👨', 'color': Colors.teal},
              {'role': 'មនុស្សស្រី', 'icon': '👩', 'color': Colors.cyan},
              {'role': 'មនុស្សចាស់', 'icon': '👴', 'color': Colors.amber},
              {'role': 'បិសាច', 'icon': '👹', 'color': Colors.red},
            ];

            final List<Map<String, String>> _sfxList = [
              {'name': 'បាសបន្លឺធ្ងន់', 'cue': '[Sub Boom]'},
              {'name': 'បេះដូងលោត', 'cue': '[Heartbeat]'},
              {'name': 'សូរសំឡេងតានតឹង', 'cue': '[Tension Riser]'},
              {'name': 'កន្ត្រាក់អារម្មណ៍', 'cue': '[Jump Scare]'},
              {'name': 'ព្រឺព្រួច', 'cue': '[Eerie Drone]'},
              {'name': 'ទះទ្វារដែក', 'cue': '[Metal Impact]'},
            ];

            final List<Map<String, String>> _sampleBeats = [
              {
                'beat': '1',
                'title': 'ឈុតបើកឆាក',
                'scene': '[ឈុតឆាក]: យប់ងងឹតសូន្យសុង ផ្គរលាន់ផ្គររន្ទះបាញ់ប្រាវៗ',
                'audio': '[សំឡេងបន្លឺ]: សំឡេងខ្យល់បោកបក់ និងផ្គរលាន់',
                'narration': 'នៅក្នុងយប់មួយដ៏សែនត្រជាក់... គ្មាននរណាម្នាក់ដឹងទេថាគ្រោះកាចកំពុងរង់ចាំពួកគេ...',
              },
              {
                'beat': '2',
                'title': 'ការលេចខ្លួនរបស់បិសាច',
                'scene': '[ឈុតឆាក]: ស្រមោលខ្មៅដ៏ធំមួយបានរំកិលខ្លួនយឺតៗតាមបង្អួច',
                'audio': '[សំឡេងបន្លឺ]: សំឡេងកកិតកញ្ចក់ និងបេះដូងលោត',
                'narration': 'ស្រាប់តែពេលនោះ ក្មេងស្រីតូចបានក្រឡេកឃើញភ្នែកក្រហមច្រាលមួយគូ...',
              },
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0F172A),
                  elevation: 0,
                  title: Row(
                    children: [
                      Container(
                        padding: const EdgeInsets.all(6),
                        decoration: BoxDecoration(
                          gradient: const LinearGradient(
                            colors: [Color(0xFFF59E0B), Color(0xFFEF4444)],
                          ),
                          borderRadius: BorderRadius.circular(8),
                        ),
                        child: const Icon(Icons.movie_creation, color: Colors.black, size: 20),
                      ),
                      const SizedBox(width: 10),
                      const Text(
                        'RecapCraft Studio Pro',
                        style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                      ),
                    ],
                  ),
                ),
                body: IndexedStack(
                  index: _currentTab,
                  children: [
                    _buildProducerTab(),
                    _buildScriptBeatsTab(),
                    _buildTeleprompterTab(),
                    _buildSoundboardTab(),
                  ],
                ),
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _currentTab,
                  onTap: (index) => setState(() => _currentTab = index),
                  type: BottomNavigationBarType.fixed,
                  backgroundColor: const Color(0xFF0F172A),
                  selectedItemColor: const Color(0xFFF59E0B),
                  unselectedItemColor: Colors.grey,
                  selectedFontSize: 11,
                  unselectedFontSize: 10,
                  items: const [
                    BottomNavigationBarItem(
                      icon: Icon(Icons.auto_awesome),
                      label: 'ផលិតរឿង',
                    ),
                    BottomNavigationBarItem(
                      icon: Icon(Icons.view_timeline),
                      label: 'ឈុតឆាក',
                    ),
                    BottomNavigationBarItem(
                      icon: Icon(Icons.chrome_reader_mode),
                      label: 'ផ្ទាំងអាន',
                    ),
                    BottomNavigationBarItem(
                      icon: Icon(Icons.music_note),
                      label: 'សំឡេង SFX',
                    ),
                  ],
                ),
              );
            }

            Widget _buildProducerTab() {
              return SingleChildScrollView(
                padding: const EdgeInsets.all(16),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    const Text(
                      '🎬 បង្កើត Script សម្រាយរឿងជាមួយ AI',
                      style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.amber),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: _titleController,
                      decoration: InputDecoration(
                        labelText: 'ចំណងជើងរឿង',
                        filled: true,
                        fillColor: const Color(0xFF1E293B),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                      ),
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: _synopsisController,
                      maxLines: 3,
                      decoration: InputDecoration(
                        labelText: 'ដំណើររឿងសង្ខេប / ព័ត៌មានលម្អិត',
                        filled: true,
                        fillColor: const Color(0xFF1E293B),
                        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                      ),
                    ),
                    const SizedBox(height: 16),
                    const Text(
                      '🎭 តេស្តសំឡេងតួអង្គទាំង ៧ (ចុចដើម្បីជ្រើសរើស):',
                      style: TextStyle(fontSize: 13, fontWeight: FontWeight.bold, color: Colors.white70),
                    ),
                    const SizedBox(height: 8),
                    Wrap(
                      spacing: 8,
                      runSpacing: 8,
                      children: _characters.map((c) {
                        final bool isSelected = _selectedVoice == c['role'];
                        return ChoiceChip(
                          label: Text('${c['icon']} ${c['role']}'),
                          selected: isSelected,
                          onSelected: (val) {
                            setState(() => _selectedVoice = c['role']);
                            ScaffoldMessenger.of(context).showSnackBar(
                              SnackBar(
                                content: Text('ជ្រើសរើសសំឡេង៖ ${c['role']}'),
                                duration: const Duration(milliseconds: 700),
                              ),
                            );
                          },
                          selectedColor: c['color'],
                        );
                      }).toList(),
                    ),
                    const SizedBox(height: 24),
                    SizedBox(
                      width: double.infinity,
                      height: 50,
                      child: ElevatedButton.icon(
                        icon: _isGenerating
                            ? const CircularProgressIndicator(color: Colors.black, strokeWidth: 2)
                            : const Icon(Icons.rocket_launch, color: Colors.black),
                        label: Text(
                          _isGenerating ? 'កំពុងដំណើរការផលិត...' : '⚡ បញ្ជាផលិត Script & សំឡេងស្វ័យប្រវត្តិ',
                          style: const TextStyle(color: Colors.black, fontWeight: FontWeight.bold),
                        ),
                        style: ElevatedButton.styleFrom(
                          backgroundColor: const Color(0xFFF59E0B),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                        ),
                        onPressed: _isGenerating
                            ? null
                            : () {
                                setState(() => _isGenerating = true);
                                Future.delayed(const Duration(seconds: 2), () {
                                  setState(() => _isGenerating = false);
                                  ScaffoldMessenger.of(context).showSnackBar(
                                    const SnackBar(content: Text('✅ Script ត្រូវបានបង្កើតរួចរាល់! សូមពិនិត្យផ្ទាំង ឈុតឆាក')),
                                  );
                                });
                              },
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildScriptBeatsTab() {
              return ListView.builder(
                padding: const EdgeInsets.all(16),
                itemCount: _sampleBeats.length,
                itemBuilder: (context, idx) {
                  final b = _sampleBeats[idx];
                  return Card(
                    color: const Color(0xFF1E293B),
                    margin: const EdgeInsets.only(bottom: 14),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                    child: Padding(
                      padding: const EdgeInsets.all(14),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.between,
                            children: [
                              Text(
                                'ឈុតទី ${b['beat']}: ${b['title']}',
                                style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.amber),
                              ),
                              IconButton(
                                icon: const Icon(Icons.volume_up, color: Colors.cyan, size: 20),
                                onPressed: () {
                                  ScaffoldMessenger.of(context).showSnackBar(
                                    SnackBar(content: Text('កំពុងចាក់សំឡេង៖ ${b['title']}')),
                                  );
                                },
                              ),
                            ],
                          ),
                          const Divider(color: Colors.white12),
                          Text(b['scene']!, style: const TextStyle(color: Colors.cyan, fontSize: 12)),
                          const SizedBox(height: 4),
                          Text(b['audio']!, style: const TextStyle(color: Colors.orangeAccent, fontSize: 12)),
                          const SizedBox(height: 8),
                          Text(
                            b['narration']!,
                            style: const TextStyle(color: Colors.white, fontSize: 14, height: 1.4),
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }

            Widget _buildTeleprompterTab() {
              return Padding(
                padding: const EdgeInsets.all(16),
                child: Column(
                  children: [
                    Row(
                      children: [
                        const Text('ទំហំអក្សរ:', style: TextStyle(fontSize: 12)),
                        Expanded(
                          child: Slider(
                            value: _fontSize,
                            min: 16,
                            max: 36,
                            activeColor: Colors.amber,
                            onChanged: (val) => setState(() => _fontSize = val),
                          ),
                        ),
                        Text('${_fontSize.toInt()}px', style: const TextStyle(color: Colors.amber)),
                      ],
                    ),
                    Expanded(
                      child: Container(
                        padding: const EdgeInsets.all(16),
                        decoration: BoxDecoration(
                          color: const Color(0xFF020617),
                          borderRadius: BorderRadius.circular(16),
                          border: Border.all(color: Colors.white10),
                        ),
                        child: SingleChildScrollView(
                          child: Text(
                            'នៅក្នុងយប់មួយដ៏សែនត្រជាក់ ខ្យល់បោកបក់រងំកាត់តាមដើមឈើធំៗ...\n\n'
                            'ក្មេងស្រីតូចកំពុងអង្គុយម្នាក់ឯងក្នុងផ្ទះបាក់បែក ស្រាប់តែពេលនោះ សំឡេងកកិតកញ្ចក់បន្លឺឡើងយ៉ាងចម្លែក...\n\n'
                            '«តើនរណានៅទីនោះ?» នាងបន្លឺឡើងទាំងសំឡេងញ័ររន្ធត់...',
                            style: TextStyle(
                              fontSize: _fontSize,
                              color: Colors.white,
                              height: 1.8,
                              fontWeight: FontWeight.w500,
                            ),
                          ),
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _buildSoundboardTab() {
              return GridView.builder(
                padding: const EdgeInsets.all(16),
                gridDelegate: const SliverGridDelegateWithFixedCrossAxisCount(
                  crossAxisCount: 2,
                  crossAxisSpacing: 12,
                  mainAxisSpacing: 12,
                  childAspectRatio: 1.3,
                ),
                itemCount: _sfxList.length,
                itemBuilder: (context, idx) {
                  final sfx = _sfxList[idx];
                  return InkWell(
                    onTap: () {
                      ScaffoldMessenger.of(context).showSnackBar(
                        SnackBar(
                          content: Text('ចាក់សំឡេង SFX: ${sfx['name']}'),
                          duration: const Duration(milliseconds: 500),
                        ),
                      );
                    },
                    child: Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: const Color(0xFF1E293B),
                        borderRadius: BorderRadius.circular(14),
                        border: Border.all(color: Colors.amber.withOpacity(0.3)),
                      ),
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          const Icon(Icons.graphic_eq, color: Colors.amber, size: 28),
                          const SizedBox(height: 8),
                          Text(
                            sfx['name']!,
                            style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13),
                          ),
                          Text(
                            sfx['cue']!,
                            style: const TextStyle(color: Colors.grey, fontSize: 11),
                          ),
                        ],
                      ),
                    ),
                  );
                },
              );
            }
          }
          EOF

          flutter build apk --release
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/

      - name: Upload APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-full-studio-${{ github.run_number }}
          name: RecapCraft Studio Pro v2.0
          files: build_output/app-release.apk
          
