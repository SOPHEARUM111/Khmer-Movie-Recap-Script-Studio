name: Build and Release APK
​on:
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
permissions:
contents: write
​steps:
- name: Checkout Code
uses: actions/checkout@v4
​- name: Setup Java 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Setup Flutter
uses: subosito/flutter-action@v2
with:
channel: 'stable'
​- name: Create Flutter Project
run: |
flutter create --org com.recapcraft --project-name recapcraft_app .
flutter pub add http cupertino_icons
sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml || true
​- name: Build Android APK
run: flutter build apk --release
​- name: Upload APK Release
uses: softprops/action-gh-release@v2
with:
tag_name: v1.0.0-${{ github.run_number }}
name: RecapCraft AI v1.0.0
files: build/app/outputs/flutter-apk/app-release.apk
