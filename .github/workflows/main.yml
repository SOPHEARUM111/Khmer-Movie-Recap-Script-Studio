name: Build Full Web Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Extract Project & Package Flutter APK
        run: |
          # 1. ពន្លាឯកសារ zip បើមានក្នុង repository
          if [ -f "khmer-movie-recap-script-studio.zip" ]; then
            unzip -o khmer-movie-recap-script-studio.zip
          fi

          # 2. បង្កើតគម្រោង Flutter App ដែលមាន WebView
          flutter create --org com.recapcraft --project-name recapcraft_app mobile_app
          cd mobile_app
          flutter pub add webview_flutter

          # បើកសិទ្ធិ Internet លើ Android
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # 3. សរសេរកូដ WebView សម្រាប់ដំណើរការផ្ទាំង Web Studio ពេញលេញលើទូរស័ព្ទ
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const FullStudioApp());
          }

          class FullStudioApp extends StatelessWidget {
            const FullStudioApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Khmer Movie Recap Script Studio',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(),
                home: const WebViewStudioScreen(),
              );
            }
          }

          class WebViewStudioScreen extends StatefulWidget {
            const WebViewStudioScreen({super.key});

            @override
            State<WebViewStudioScreen> createState() => _WebViewStudioScreenState();
          }

          class _WebViewStudioScreenState extends State<WebViewStudioScreen> {
            late final WebViewController _controller;
            bool _isLoading = true;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFF090D16))
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onPageFinished: (String url) {
                      setState(() {
                        _isLoading = false;
                      });
                    },
                  ),
                )
                ..loadRequest(Uri.parse('https://sophearum111.github.io/Khmer-Movie-Recap-Script-Studio/'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFF090D16),
                body: SafeArea(
                  child: Stack(
                    children: [
                      WebViewWidget(controller: _controller),
                      if (_isLoading)
                        const Center(
                          child: CircularProgressIndicator(color: Color(0xFFF59E0B)),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 4. Build ចេញជាឯកសារ APK
          flutter build apk --release
          mkdir -p ../build_output
          cp build/app/outputs/flutter-apk/app-release.apk ../build_output/

      - name: Upload APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0-studio-${{ github.run_number }}
          name: Khmer Movie Recap Studio v3.1
          files: build_output/app-release.apk
          
