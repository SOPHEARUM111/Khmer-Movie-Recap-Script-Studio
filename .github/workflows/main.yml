name: Build and Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Prepare Project
        run: |
          mkdir -p build_temp
          cd build_temp
          flutter create --org com.recapcraft --project-name recapcraft_app .
          flutter pub add http cupertino_icons
          
          # បើកសិទ្ធិ Internet ក្នុង AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml || true
          
          # បិទភ្ជាប់កូដ App ចូលក្នុង main.dart ដោយកែសម្រួលរួចជាស្រេច
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:http/http.dart' as http;

          const String kBackendBaseUrl = "http://10.0.2.2:8000";

          void main() {
            runApp(const MovieRecapApp());
          }

          class MovieRecapApp extends StatelessWidget {
            const MovieRecapApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'RecapCraft AI 7-Voice Studio',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF07090E),
                  primaryColor: const Color(0xFFE11D48),
                ),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            final TextEditingController _titleController = TextEditingController(text: "Train to Busan");
            int _selectedDuration = 90;
            bool _includeMonster = true;

            final List<Map<String, dynamic>> _characters = [
              {"role": "អ្នកសម្រាយ", "icon": "🎙️", "color": Colors.indigo},
              {"role": "ក្មេងប្រុស", "icon": "👦", "color": Colors.blue},
              {"role": "ក្មេងស្រី", "icon": "👧", "color": Colors.pink},
              {"role": "មនុស្សប្រុស", "icon": "👨", "color": Colors.cyan},
              {"role": "មនុស្សស្រី", "icon": "👩", "color": Colors.teal}, // កែពី emerald មក teal
              {"role": "មនុស្សចាស់", "icon": "👴", "color": Colors.amber},
              {"role": "បិសាច", "icon": "👹", "color": Colors.red},
            ];

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0F172A),
                  title: const Text("RecapCraft AI 7-Voice Studio", style: TextStyle(fontSize: 16)),
                ),
                body: SingleChildScrollView(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      TextField(
                        controller: _titleController,
                        decoration: InputDecoration(
                          filled: true,
                          fillColor: const Color(0xFF111827),
                          hintText: "ចំណងជើងរឿង (Movie Title)",
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                      ),
                      const SizedBox(height: 16),
                      Wrap(
                        spacing: 8,
                        children: _characters.map((char) {
                          return Chip(
                            avatar: Text(char["icon"]),
                            label: Text(char["role"]),
                            backgroundColor: (char["color"] as MaterialColor).withOpacity(0.2),
                          );
                        }).toList(),
                      ),
                      const SizedBox(height: 20),
                      ElevatedButton(
                        style: ElevatedButton.styleFrom(
                          backgroundColor: Colors.indigoAccent,
                          minimumSize: const Size(double.infinity, 50),
                          shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                        ),
                        onPressed: () {
                          ScaffoldMessenger.of(context).showSnackBar(
                            const SnackBar(content: Text("ប្រព័ន្ធរួចរាល់សម្រាប់ការផលិត!")),
                          );
                        },
                        child: const Text("🎭 ផលិតសម្រាយរឿង ៧ សំឡេងតួ", style: TextStyle(fontWeight: FontWeight.bold)),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Android APK
        run: |
          cd build_temp
          flutter build apk --release

      - name: Upload APK Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: RecapCraft AI v1.0.0 (Build #${{ github.run_number }})
          files: build_temp/build/app/outputs/flutter-apk/app-release.apk
          
